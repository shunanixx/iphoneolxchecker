[project]
name = "olx-iphone-bot"
version = "0.1.0"
description = "Telegram bot that monitors OLX for used iPhones and scores listings with Gemini"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
